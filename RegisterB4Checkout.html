        <style>
            * {
    font-family: Sans-Serif, Arial;
}

.a {
    display: grid;
    height: 80vh;
    align-items: center;
    justify-content: center;
}

form {
    padding: 2vmax 3vmax 4vmax;
     border: 2px solid black;
}

    padding: 30px 0 0 0;
}

    <body>
        <div class="a">
            <form>
                <div class="TextLayout">
                    <h2>Create an account</h2>
                    <div id="Message">
                        <p>Register or login before you can continue to checkout.</p>
                    </div>
                </div>

                <br>

                <div class="InsideContents">
                        <div>
                    <label for="username">First Name</label>
                    <input id="username" type="text" placeholder="John" required>
                </div>

                <br>

                <div>
                    <label for="lastname">Last Name</label>
                    <input id="lastname" type="text" placeholder="Pork" required>
                </div>

                <br>

                <div>
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Password" required maxlength="12">
                </div>

                <br>

                <div>
                    <label for="email">Email:</label>
                    <input id="email" type="email" placeholder="Spants@gmail.com" required>
                </div>

                <br>

                <div>
                    <label for="phone">Phone Number</label>
                    <input id="phone" type="tel" placeholder="+47 800 30 300" required>
                </div>

                <br>
                
                <div>
                    <label for="bdate">Birth date:</label>
                    <input id="bdate" type="date">
                </div>

                <br><br>

                <div id="SignUp">
                    <button style="padding: 10px 40px;"><a href="" style="color: black; text-decoration: none;">Create account</a></button>
                </div>
                </div>
            </form>
        </div>
        <div id="BigSpacing"></div>
