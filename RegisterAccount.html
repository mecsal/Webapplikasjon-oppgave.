<!DOCTYPE html>
<html lang="en">
    <head>
        <meta chasret="utf-8">
        <meta content="viewport" content="width=device-width, initial-scale="1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&" />
        <style>
* {
    padding: 0;
    margin: 0;
    font-family: "Nunito Sans", sans-serif;
}

h2 {
    font-family: "Nunito Sans", sans-serif;
    font-size: 2rem;
}

.a {
    display: flex;
    height: 80vh;
    justify-content: space-between;
}

.a input[type="text"],
input[type="password"],
input[type="email"],
input[type="tel"] {
    border:  1px solid #121212;
    font-size: 18px;
    padding: 20px 20px;
    width: 500px;
    border-radius: 10px;
    background-color: #121212;
    color: white;
}

.a input::placeholder {
    color: white;
}

form {
    padding: 4vmax 4vmax 4vmax;
    margin: 0 120px 0 0;
}

.InsideContents {
    padding: 10px 0 0 0;
}

#Alr {
    margin: 1vmax 0 0 0;
}

#Alr a:hover {
    color: blue;
}


#SignUp input {
    padding: 1rem 3vmax;
    border: 1px solid #121212;
    background-color: #121212;
    border-radius: 100px;
    width: 100%;
    font-size: 18px;
    color: white;
    transition: ease-out 0.2s;
}

#SignUp input:hover {
    cursor: pointer;
    background-color: white;
    color: #121212;
}

#SignUp span {
    font-size: 18px;
    color: white;
}

.Cover img {
    position: relative;
    max-width: 120vh;
    height: 115.2vh;
    object-fit: cover;
    mask-image: linear-gradient(to right, black 70%, transparent);
    -webkit-mask-image: linear-gradient(to right, black 70%, transparent);
}

#image1 {
    position: relative;
}

#shadow {
    z-index: 1;
    background-color: black;
    padding: 57.61vh 60vh;
    position: absolute;
    opacity: 50%;
    mask-image: linear-gradient(to right, black 70%, transparent);
    -webkit-mask-image: linear-gradient(to right, black 70%, transparent);
}
        </style>
        <title>Spillbutikk.com - Account registeration</title>
    </head>
    <body>
        <div class="a">
            <div class="Cover">
                <div id="shadow"></div>
                <div id="image1">
                    <img src="FolderOfImages/dark_souls_3_main_art_1.jpg">
                </div>
            </div>
            <form>
                <div id="TextLayout">
                    <h2>Create an account</h2>
                </div>

                <br>

                <div class="InsideContents">
                    <div>
                        <input id="username" type="text" placeholder="First name:" required>
                    </div>

                <br>

                <div>
                    <input id="lastname" type="text" placeholder="Last name:" required>
                </div>

                <br>

                <div>
                    <input id="password" type="password" placeholder="Password" required>
                </div>

                <br>

                <div>
                    <input id="email" type="email" placeholder="Email:" required>
                </div>

                <br>

                <div>
                    <input id="phone" type="tel" placeholder="Phone number:" required>
                </div>

                <br>
                
                <div>
                    <input id="birth" type="text" placeholder="Birthdate (dd/mm/yyyy)">
                </div>

                <br><br>

                <div id="SignUp">
                    <input style="text-decoration: none;" type="submit" value="Create account">
                </div>
                <div id="Alr">
                    <p>Already have an account? Login <a href="">here</a>.</p>
                </div>
                </div>
            </form>
        </div>
        <div id="BigSpacing"></div>

      <div class="TheFooter">
