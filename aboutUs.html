<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width="device-width, initial-scale=1.0">
        <title>
            About Us
        </title>
        <style>

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background-color: sandybrown;
            }

            .about-us {
                height: 100vh;
                display: grid;
                justify-content: center;
                align-content: center;
                grid-template-columns: 1fr 1fr 1fr;
                grid-template-rows: 1fr 1fr 1fr;
                gap: 10px;
                padding: 10px;
            }

            .front-text {
                display: grid;
                justify-items: center;
                align-items: center;
                grid-column: 1 / 4;
                grid-row: 1 / 2;
            }

            .logo {
                display: grid;
                justify-items: center;
                align-items: center;
                grid-column: 1 / 2;
                grid-row: 2 / 4;
            }

            .text {
                display: grid;
                justify-items: center;
                align-items: center;
                grid-column: 2 / 4;
                grid-row: 2 / 4;
            }

            .about-us-text {
                font-family: sans-serif, Arial;
                font-weight: bold;
                font-size: 20px;
                color: white;
                text-decoration: underline;
            }

            .paragraph {
                font-family: sans-serif, Arial;
                font-weight: bold;
                font-size: 14px;
                color: white;
            }

            .bilde-logo {
                height: 100%;
                width: 100%;
                object-fit: contain;
            }
            

            .info {
                background-color: rgb(136, 93, 56);
                border-color: rgb(99, 69, 42);
                border-style: solid;
                border-radius: 8px;
                border-width: 1px;
                transition: box-shadow 0.15s,
                    opacity 0.15s;
            }

            .info:hover {
                box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.15);
                opacity: 0.7;
            }

            .info:active {
                opacity: 0.8;
            }
        </style>
        
    </head>
    <body>
        <div class="about-us">

            <div class="info front-text">
                <h1 class="about-us-text">About Us</h1>
            </div>

            <div class="info logo">
                <img class="bilde-logo" src="css/css-course/thumbnails/image-spillbutikk.png">
            </div>

            <div class="info text">
                <p class="paragraph">tekst her</p>
            </div>
        </div>
    </body>
</html>
